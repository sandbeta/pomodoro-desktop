<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>番茄钟 · 网页演示</title>
    <meta name="description" content="番茄钟桌面应用的网页演示版：计时、阶段流转、中断记录、统计与设置全部可用，数据存在你自己的浏览器 localStorage 里，不联网、不上传。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%85%3C/text%3E%3C/svg%3E" />
    <style>
      /* 与 Electron 窗口的 backgroundColor 对齐，使网页版观感与桌面版一致 */
      html, body { background: #fff6ee; }
    </style>
    <script>
      /*
       * 网页演示层的 electronAPI 桩。
       * 校验规则与 src/main/index.js 的主进程实现保持一致，
       * 差别仅在于落盘点是 localStorage 而不是 JSON 文件。
       *
       * 有意不暴露 data.pickDir：浏览器没有「把历史文件搬到同步目录」这回事，
       * 设置面板会因此自动隐藏「改存到别的目录」按钮，而不是显示一个点了没反应的控件。
       */
      (function () {
        var SETTINGS_KEY = 'pomodoro-demo-settings'
        var RECORDS_KEY = 'pomodoro-demo-records'

        var SETTINGS_DEFAULTS = {
          focus: 25, short: 5, long: 15, longEvery: 4,
          autoStart: false, sound: true, notify: true, minimizeToTray: true, dataDir: ''
        }
        var SETTINGS_NUM = { focus: [1, 180], short: [1, 60], long: [1, 180], longEvery: [1, 10] }
        var SETTINGS_BOOL = ['autoStart', 'sound', 'notify', 'minimizeToTray']
        var VALID_MODES = { focus: 1, short: 1, long: 1 }
        var MAX_RECORDS = 20000

        function read(key, fallback) {
          try {
            var raw = localStorage.getItem(key)
            return raw ? JSON.parse(raw) : fallback
          } catch (e) {
            return fallback
          }
        }

        // 与主进程 cleanRecord 同构：逐字段白名单，不合法返回 null
        function cleanRecord(rec) {
          if (!rec || typeof rec !== 'object') return null
          if (!VALID_MODES[rec.mode]) return null
          if (typeof rec.startedAt !== 'number' || !isFinite(rec.startedAt)) return null
          if (typeof rec.endedAt !== 'number' || !isFinite(rec.endedAt)) return null
          if (typeof rec.durationSec !== 'number' || !isFinite(rec.durationSec)) return null
          var out = {
            id: rec.id === undefined || rec.id === null ? String(Date.now()) : String(rec.id),
            mode: rec.mode,
            startedAt: rec.startedAt,
            endedAt: rec.endedAt,
            durationSec: rec.durationSec,
            completed: rec.completed === true
          }
          if (typeof rec.elapsedSec === 'number' && isFinite(rec.elapsedSec)) out.elapsedSec = rec.elapsedSec
          return out
        }

        function sanitizeSettings(raw) {
          var out = {}
          if (!raw || typeof raw !== 'object') return out
          for (var k in SETTINGS_NUM) {
            if (raw[k] !== undefined) {
              var n = Number(raw[k])
              if (isFinite(n)) out[k] = Math.min(SETTINGS_NUM[k][1], Math.max(SETTINGS_NUM[k][0], Math.round(n)))
            }
          }
          for (var i = 0; i < SETTINGS_BOOL.length; i++) {
            var b = SETTINGS_BOOL[i]
            if (raw[b] !== undefined) out[b] = !!raw[b]
          }
          return out
        }

        function effectiveSettings() {
          return Object.assign({}, SETTINGS_DEFAULTS, read(SETTINGS_KEY, {}))
        }

        function writeRecords(list) {
          try {
            localStorage.setItem(RECORDS_KEY, JSON.stringify(list.slice(-MAX_RECORDS)))
            return true
          } catch (e) {
            return false
          }
        }

        window.electronAPI = {
          ping: function () { return 'pong' },
          meta: { platform: 'web', versions: {} },
          records: {
            list: async function () { return read(RECORDS_KEY, []) },
            append: async function (rec) {
              var clean = cleanRecord(rec)
              if (!clean) return false
              var records = read(RECORDS_KEY, [])
              records.push(clean)
              return writeRecords(records)
            },
            replace: async function (list) {
              if (!Array.isArray(list)) return { ok: false, error: '不是数组' }
              var clean = list.map(cleanRecord).filter(Boolean)
              writeRecords(clean)
              return { ok: true, count: clean.length, dropped: list.length - clean.length }
            },
            clear: async function () {
              localStorage.setItem(RECORDS_KEY, '[]')
              return true
            },
            where: async function () {
              return '浏览器本地存储 · ' + RECORDS_KEY
            }
          },
          data: {
            // 浏览器里用文件选择替代原生对话框，导入桌面版导出的 JSON 因此真的可用
            openJson: function () {
              return new Promise(function (resolve) {
                var input = document.createElement('input')
                input.type = 'file'
                input.accept = '.json,application/json'
                input.style.display = 'none'
                input.onchange = function () {
                  var f = input.files && input.files[0]
                  if (!f) { resolve({ ok: false, canceled: true }); return }
                  var fr = new FileReader()
                  fr.onload = function () { resolve({ ok: true, path: f.name, text: String(fr.result) }) }
                  fr.onerror = function () { resolve({ ok: false, error: '读取文件失败' }) }
                  fr.readAsText(f, 'utf8')
                }
                document.body.appendChild(input)
                input.click()
                setTimeout(function () { input.remove() }, 1000)
              })
            }
          },
          settings: {
            get: async function () { return effectiveSettings() },
            set: async function (patch) {
              var clean = sanitizeSettings(patch)
              localStorage.setItem(SETTINGS_KEY, JSON.stringify(Object.assign(read(SETTINGS_KEY, {}), clean)))
              return effectiveSettings()
            }
          },
          // 桌面版在窗口可见且聚焦时本就抑制通知，网页标签页正对应这一状态，故如实返回 false
          notify: async function () { return false },
          // 桌面版走系统保存对话框，网页版用浏览器下载替代
          exportSave: async function (name, content) {
            try {
              var blob = new Blob([String(content == null ? '' : content)], { type: 'text/plain;charset=utf-8' })
              var url = URL.createObjectURL(blob)
              var a = document.createElement('a')
              a.href = url
              a.download = String(name || 'pomodoro-history.json')
              document.body.appendChild(a)
              a.click()
              a.remove()
              setTimeout(function () { URL.revokeObjectURL(url) }, 4000)
              return { ok: true, path: a.download }
            } catch (e) {
              return { ok: false, error: e.message }
            }
          }
        }
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-VskuEg-S.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BpQlafjW.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
