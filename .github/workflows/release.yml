name: 发布 Release

# 打 tag 即自动构建并挂到该 tag 的 Release 上。
# 存在的意义：82MB 的 exe 靠人在网页上拖，既繁琐又依赖猜对 GitHub 前端的 DOM。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已有 tag（含 v），例如 v0.3.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: 检出对应 tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 仓库自带 .npmrc 指向 npmmirror（为国内网络准备），在 GitHub runner 上反而更慢且不稳，
      # 这里用 CLI 参数覆盖 —— CLI 优先级高于项目 .npmrc。
      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org

      # 「改 core 必须同步跑单测」这条规矩，到这里才算有强制手段
      - name: 单元测试
        run: npm test

      # 不用 npm run dist：发布流水线必须与「被检出的那个 tag 里写了什么脚本」解耦，
      # 否则老 tag 里缺 --publish never 就会让 CI 去自建 Release（electron-builder
      # 检测到 CI 会隐式发布，且 v26 只是警告、v27 才默认关闭）。
      - name: 构建
        run: npm run build

      - name: 打包 Windows 产物
        run: npx electron-builder --win --publish never

      # 用官方 gh CLI 上传，而不是 softprops/action-gh-release。
      # 原因：本项目的产物名含中文（番茄钟-便携版-0.3.0.exe），而 softprops 会先按
      # URL 安全字符清洗上传名 —— 两个中文名清洗后塌缩成同一个 "-.-0.3.0.exe"，
      # 于是互相覆盖，只剩一个乱名资产，随后它去 PATCH 恢复原名时目标已不存在，报 404。
      # gh release upload 走的是与网页上传相同的路径，能正确保留中文名。
      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.exe --clobber
          gh release view "$TAG"
